<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14171c">
  <title>3D Model Viewer · Model Studio</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../gesture-navigation.css">
  <link rel="stylesheet" href="./studio.css">
  <script type="importmap">
    {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/"}}
  </script>
</head>
<body>
  <header class="toolbar">
    <div class="identity"><span class="mark" aria-hidden="true"></span><h1>Model Studio</h1></div>
    <div class="toolbar-actions">
      <button id="panel-toggle" type="button" aria-controls="inspector" aria-expanded="false">Looks &amp; View</button>
      <button id="open-model" class="primary" type="button">Open model</button>
      <input id="files" type="file" multiple hidden
        accept=".glb,.gltf,.obj,.stl,.mtl,.bin,.png,.jpg,.jpeg,.webp,.avif,.gif,.bmp">
    </div>
  </header>
  <main class="workspace">
    <section id="viewport" aria-label="Model viewport">
      <canvas id="model-canvas" aria-label="Interactive 3D model"></canvas>
      <div class="asset-label">
        <strong id="model-name">Studio sample</strong>
        <span id="model-info"></span>
      </div>
      <div id="navigationTools">
        <button id="undoCamera" type="button" aria-label="Undo camera movement" title="Undo view" disabled>↶</button>
        <button id="quickReset" type="button" aria-label="Frame model" title="Frame model">⌗</button>
        <button id="precisionButton" type="button" aria-label="Precision navigation" aria-expanded="false"><span class="reticle"></span></button>
        <div id="precisionMenu" role="menu" aria-label="Precision mode" hidden></div>
        <section id="precisionInstrument" aria-label="Precision instrument" hidden>
          <div class="precision-heading"><strong id="precisionTitle"></strong><button id="closePrecision" type="button" aria-label="Close precision instrument">×</button></div>
          <p id="precisionHint"></p>
          <output id="precisionValue"></output>
          <div id="precisionSurface" tabindex="0"><div class="surface-art"></div></div>
          <div id="precisionZoom" hidden><label for="precisionZoomSlider">Camera distance</label><input id="precisionZoomSlider" type="range" min="0" max="1000"></div>
        </section>
        <div id="clutchStatus" hidden>Precision clutch</div>
      </div>
      <p id="status" role="status" aria-live="polite" hidden></p>
    </section>
    <aside id="inspector" aria-label="Model settings">
      <div class="inspector-heading"><h2>Looks &amp; View</h2><button id="close-panel" type="button" aria-label="Close settings">×</button></div>
      <section class="settings-section" aria-labelledby="appearance-heading">
        <h3 id="appearance-heading">Appearance</h3>
        <label for="look">Surface</label>
        <select id="look">
          <optgroup label="Studio"><option value="original">Original materials</option><option value="clay">Clay</option><option value="unlit">Unlit</option><option value="normals">Geometry normals</option></optgroup>
          <optgroup label="Resonance"><option value="resonance-mineral">Mineral sheen</option></optgroup>
          <optgroup label="Banana Palm"><option value="banana-cel">Initial cel shading</option><option value="banana-ps1">PS1</option></optgroup>
          <optgroup label="Legacy looks"><option value="legacy-pixel">Pixel</option><option value="legacy-watercolour">Watercolour</option><option value="legacy-ink">Ink / Sketch</option><option value="legacy-mono">Monochrome</option></optgroup>
        </select>
        <label for="lighting">Lighting</label>
        <select id="lighting">
          <option value="neutral">Neutral studio</option><option value="softbox">Softbox</option><option value="rim">Rim light</option><option value="resonance">Resonance chamber</option><option value="banana">Banana Palm daylight</option>
        </select>
        <div id="effect-controls">
          <h4>Effects</h4>
          <label class="toggle"><input id="bloom" type="checkbox"> Bloom</label>
          <label class="toggle"><input id="ribbons" type="checkbox"> Light ribbons</label>
          <label class="toggle"><input id="sparks" type="checkbox"> Sparks</label>
          <label class="toggle"><input id="animate" type="checkbox"> Animate effects</label>
        </div>
      </section>
      <section class="settings-section" aria-labelledby="camera-heading">
        <h3 id="camera-heading">Camera</h3>
        <label for="projection">Projection</label>
        <select id="projection"><option value="perspective">Perspective</option><option value="orthographic">Orthographic</option></select>
        <div class="snap-views" role="group" aria-label="Snap view">
          <button type="button" data-view="front">Front</button><button type="button" data-view="back">Back</button>
          <button type="button" data-view="left">Left</button><button type="button" data-view="right">Right</button>
          <button type="button" data-view="top">Top</button><button type="button" data-view="bottom">Bottom</button>
        </div>
        <label class="toggle"><input id="grid" type="checkbox"> Ground grid</label>
        <label class="toggle"><input id="spin" type="checkbox"> Turntable</label>
        <label id="animation-control" class="toggle" hidden><input id="play-animation" type="checkbox"> Play model animation</label>
      </section>
      <div class="inspector-footer">
        <button id="sample" type="button">Studio sample</button>
        <a href="../index.html">Legacy Render Lab ↗</a>
      </div>
    </aside>
  </main>
  <script type="module" src="./studio.js"></script>
</body>
</html>
