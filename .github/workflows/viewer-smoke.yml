name: Model Viewer Browser Smoke

on:
  pull_request:
    paths:
      - '**'
      - '.github/workflows/viewer-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STUDIO_THREE: ${{ github.workspace }}/node_modules/three
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1 three@0.168.0
      - run: npx playwright install --with-deps chromium webkit
      - name: Launch site
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/porygon-server.log 2>&1 &
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8765/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/porygon-server.log
          exit 1
      - name: Test camera gesture recognition
        run: node tests/gesture-navigation.mjs
      - name: Exercise V2 studio and public glTF fixtures
        run: |
          bash tools/fetch-v2-fixtures.sh
          node tests/model-studio.mjs
      - name: Exercise V2 stone controls
        run: STUDIO_URL=http://127.0.0.1:8765/v2/ node tests/model-studio-stones.mjs
      - name: Exercise V3 mobile viewer and ensure no models are bundled
        run: node tests/model-studio-v3.mjs
      - name: Exercise desktop and mobile V1
        run: node tests/viewer-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-viewer-smoke-screenshots
          path: viewer-smoke-artifacts/
          if-no-files-found: ignore
